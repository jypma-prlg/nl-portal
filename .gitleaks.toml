title = "NL Portal gitleaks config"

[extend]
useDefault = true

# Everything allowlisted here is a known, intentional dev/test fixture, not a real secret:
# - backend/docker-resources/imports/**: fixed ZGW-service fixtures of the openklant integration-test stack.
#   The local dev stack (docker-compose/) has no fixed secrets any more: `mise run dev:setup` generates them.
# - The files `mise run dev:setup` generates (gitignored, so never in a CI checkout, but present in a local
#   work tree): docker-compose/.generated/**, docker-compose/.env, backend/app*/.env.properties.
# - **/src/test/**: test-only config and certificates (e.g. backend/core/src/test/resources/ssl).
# - backend/*/build/**: Gradle's own copies of the above (resources/test, test-results,
#   reports/tests) under a gitignored, generated directory. CI always scans a fresh checkout (no
#   build/ present), so this only matters for `mise run security:secrets-scan` run locally after a
#   build - without it, the exact same test fixtures above get re-flagged from their build/ copy.
# - *.example: example files whose whole point is to show the shape of a real config file.
[allowlist]
description = "Known dev/test fixtures, not real secrets"
paths = [
  '''backend/docker-resources/imports/.*''',
  '''docker-compose/\.generated/.*''',
  '''docker-compose/\.env$''',
  '''backend/app(-dev)?/\.env\.properties$''',
  '''backend/.*/src/test/.*''',
  '''backend/.*/build/.*''',
  '''.*\.example$''',
]
