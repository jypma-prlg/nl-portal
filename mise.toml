[tools]
# Keep in sync with frontend/package.json's "packageManager" field.
pnpm = "11.28.11"
# javaVersion in backend/gradle.properties is leading; `mise run java:check-version` (CI) fails on a mismatch.
java = "temurin-25"
syft = "1.57.0"
grype = "0.121.2"
gitleaks = "8.30.1"
k6 = "2.3.0"

# Taken heten <domein>:<actie>. De aggregaten zonder prefix (build, test, lint, arch-check) roepen via
# `depends` de domeintaken aan. Taken van meer dan een regel staan als bestand onder mise-tasks/.
# Er is bewust geen `e2e`-aggregaat: de repo heeft nog geen e2e-tests.
# Taken die `./gradlew` aanroepen hebben `shell = "bash -c"` nodig: onder Windows draait mise anders cmd.

# --- Aggregaten ---

[tasks.build]
description = "Bouw backend en frontend"
depends = ["backend:build", "frontend:build"]

[tasks.test]
description = "Draai de unit-tests van backend, frontend en scripts (integratietests: backend:integration-test)"
depends = ["backend:test", "frontend:test", "scripts:test", "perf:test"]

[tasks.lint]
description = "Lint, typecheck en formatteringscontrole van backend en frontend"
depends = ["backend:lint", "frontend:lint", "frontend:typecheck", "frontend:prettier", "perf:check"]

[tasks.arch-check]
description = "Bewaak de architectuurregels (backend: ArchUnit; frontend: package-boundaries valt onder frontend:lint)"
depends = ["backend:arch-check"]

# --- Backend ---

[tasks."backend:build"]
description = "Compileer en assembleer de backend (zonder tests)"
dir = "backend"
shell = "bash -c"
run = "./gradlew assemble --console=plain"

[tasks."backend:test"]
description = "Draai de backend-unit-tests (zonder integratietests)"
dir = "backend"
shell = "bash -c"
run = "./gradlew test --console=plain"

[tasks."backend:lint"]
description = "Controleer opmaak en kopregels van de backend (Spotless/ktlint)"
dir = "backend"
shell = "bash -c"
run = "./gradlew spotlessCheck --console=plain"

[tasks."backend:check"]
description = "Bouw, test en lint de backend in een Gradle-aanroep (./gradlew build; wat CI als backend-poort draait)"
dir = "backend"
shell = "bash -c"
run = "./gradlew build --console=plain"

[tasks."backend:dependency-report"]
description = "Genereer het HTML-dependencyrapport van de backend (release-artefact)"
dir = "backend"
shell = "bash -c"
run = "./gradlew htmlDependencyReport"

[tasks."backend:arch-check"]
description = "Draai de ArchUnit-architectuurtests van de backend"
dir = "backend"
shell = "bash -c"
run = "./gradlew :architecture-test:test --console=plain"

[tasks."arch:diagram:backend"]
description = "Genereer het PlantUML-diagram van backend-modules, lagen en regeldekking (site/architectuur/img/plantuml/modules.puml) (#386)"
dir = "backend"
shell = "bash -c"
run = "./gradlew :architecture-test:architectureDiagram --console=plain"

[tasks."arch:diagram:frontend"]
description = "Genereer het PlantUML-diagram van de frontend-packages (site/architectuur/img/plantuml/frontend.puml) (#386)"
run = "node scripts/generate-frontend-diagram.mjs"

[tasks."arch:diagram"]
description = "Genereer de PlantUML-diagrammen van backend en frontend; commit het resultaat, en draai arch:diagram:render voor de SVG (#386)"
depends = ["arch:diagram:backend", "arch:diagram:frontend"]

[tasks."arch:diagram:render"]
description = "Render beide PlantUML-diagrammen naar SVG via Docker (site/architectuur/img/plantuml/*.svg); draai eerst arch:diagram (#386)"
shell = "bash -c"
run = """
for name in modules frontend; do
  docker run --rm -i plantuml/plantuml:1.2025.4 -tsvg -pipe < site/architectuur/img/plantuml/$name.puml > site/architectuur/img/plantuml/$name.svg
done
"""

[tasks."backend:integration-test"]
description = "Backend-integratietests over alle modules (vereist Docker voor de OpenKlant-container in zgw:openklant)"
dir = "backend"
shell = "bash -c"
run = "./gradlew integrationTest --continue"

[tasks."backend:integration-test-app"]
description = "Backend-integratietests alleen voor :app (sneller)"
dir = "backend"
shell = "bash -c"
run = "./gradlew :app:integrationTest"

[tasks."backend:module-layer-changes"]
description = "Toon nieuwe backend-modules en laagwijzigingen in ModuleLayers t.o.v. origin/main, of t.o.v. MODULE_LAYERS_BASE_REF als die gezet is (zoals de PR-opmerking uit CI, #177)"
dir = "backend"
shell = "bash -c"
run = 'if [ -n "${MODULE_LAYERS_BASE_REF:-}" ]; then ./gradlew :architecture-test:moduleLayerChanges -q -PmoduleLayersBaseRef="$MODULE_LAYERS_BASE_REF"; else ./gradlew :architecture-test:moduleLayerChanges -q; fi'

[tasks."backend:pitest"]
description = "Mutation testing op backend/core (ADR 0011); HTML-rapport in backend/core/build/reports/pitest"
dir = "backend"
shell = "bash -c"
run = "./gradlew :core:pitest"

# backend:pitest-changed staat in mise-tasks/backend/pitest-changed

# --- Frontend ---

[tasks."frontend:install"]
description = "Installeer de frontend-dependencies volgens pnpm-lock.yaml"
dir = "frontend"
sources = ["pnpm-lock.yaml", "package.json", "packages/*/package.json"]
run = "pnpm install --frozen-lockfile"

[tasks."frontend:check"]
description = "Bouw, lint, typecheck, test en prettier-controle van de frontend (wat CI als frontend-poort draait)"
depends = ["frontend:build", "frontend:lint", "frontend:typecheck", "frontend:test", "frontend:prettier"]

[tasks."frontend:build"]
description = "Bouw alle frontend-packages"
dir = "frontend"
depends = ["frontend:install"]
run = "pnpm -r build"

[tasks."frontend:lint"]
description = "ESLint (incl. package-boundaries) en Stylelint op de frontend"
dir = "frontend"
depends = ["frontend:install"]
run = ["pnpm lint", "pnpm lint:css"]

[tasks."frontend:typecheck"]
description = "TypeScript-typecheck van alle frontend-packages (na de build: packages lezen elkaars dist)"
dir = "frontend"
depends = ["frontend:build"]
run = "pnpm typecheck"

[tasks."frontend:test"]
description = "Draai de frontend-tests (Vitest; na de build: packages lezen elkaars dist)"
dir = "frontend"
depends = ["frontend:build"]
run = "pnpm test"

[tasks."frontend:prettier"]
description = "Controleer de frontend-opmaak met Prettier (zonder te wijzigen)"
dir = "frontend"
depends = ["frontend:install"]
run = "pnpm prettier"

# --- Performance (k6, ADR 0018) ---

[tasks."perf:test"]
description = "Draai de unit-tests van de k6-helpers (performance/lib/*.test.ts)"
run = 'node --test "performance/lib/*.test.ts"'

[tasks."perf:check"]
description = "Controleer dat de k6-scripts laden (syntax en imports), zonder stack"
run = "k6 inspect -e PERF_USERNAME=check -e PERF_PASSWORD=check performance/scenarios/smoke.ts"

[tasks."perf:smoke"]
description = "Draai de k6-smoke-test (1 gebruiker) tegen de draaiende compose-stack; faalt bij een fout of gemiste threshold. Vereist PERF_USERNAME en PERF_PASSWORD"
run = "k6 run performance/scenarios/smoke.ts"

# --- Scripts, docs, architectuurmodel, compliance ---

[tasks."scripts:test"]
description = "Draai de tests van de repo-scripts (scripts/*.test.mjs)"
run = 'node --test "scripts/**/*.test.mjs"'

[tasks."docs:install"]
description = "Installeer de dependencies van de docs-site"
dir = "site"
sources = ["pnpm-lock.yaml", "package.json"]
run = "pnpm install"

[tasks."docs:test"]
description = "Draai de navigatiestructuurtests van de docs-site (ADR 0006)"
dir = "site"
depends = ["docs:install"]
run = "pnpm run test"

[tasks."docs:build"]
description = "Bouw de docs-site; faalt op elke kapotte interne link of anchor"
dir = "site"
depends = ["docs:install", "docs:test"]
run = "pnpm run build"

[tasks."docs:dev"]
description = "Bekijk de docs-site lokaal"
dir = "site"
depends = ["docs:install"]
run = "pnpm run dev"

[tasks."docs:capabilities"]
description = "Genereer arc42-hoofdstuk 5/11 en site/likec4/capabilities.generated.c4 opnieuw uit docs/capabilities.yaml"
run = "node scripts/generate-capabilities-docs.mjs"

# docs:capabilities-check staat in mise-tasks/docs/capabilities-check

[tasks."compliance:check"]
description = "Faal als een bron-ID onbekend is of een normatieve bron geen check of afwijkingsbesluit heeft (site/compliance/normatieve-bronnen.md)"
run = "node scripts/check-compliance.mjs"

[tasks."likec4:validate"]
description = "Valideer het LikeC4-architectuurmodel (site/likec4)"
run = "npx --yes likec4@1.60.0 validate site/likec4"

[tasks."likec4:start"]
description = "Bekijk het LikeC4-architectuurmodel in een lokale dev-server"
run = "npx --yes likec4@1.60.0 start site/likec4"

[tasks."likec4:export"]
description = "Exporteer de LikeC4-views naar PNG onder site/architectuur/img/likec4 (getoond op de C4-pagina; na een modelwijziging opnieuw draaien en committen)"
sources = ["site/likec4/**/*.c4"]
outputs = ["site/architectuur/img/likec4/**/*.png"]
run = "npx --yes likec4@1.60.0 export png site/likec4 --output site/architectuur/img/likec4"

[tasks."java:check-version"]
description = "Faal als mise, Dockerfile, README of workflows een andere Java-versie noemen dan javaVersion in backend/gradle.properties"
run = "node scripts/check-java-version.mjs"

# --- Dependencies ---

[tasks."deps:outdated-backend"]
description = "Toon beschikbare backend-dependency-updates (past niets aan; versies staan vast in Dependencies.kt/Versions.kt, bijwerken is handwerk of Renovate)"
dir = "backend"
shell = "bash -c"
run = "./gradlew dependencyUpdates -Drevision=release"

[tasks."deps:outdated-frontend"]
description = "Toon beschikbare frontend-dependency-updates (past niets aan)"
dir = "frontend"
run = "pnpm outdated -r"

[tasks."deps:outdated"]
description = "Toon beschikbare backend- en frontend-dependency-updates"
depends = ["deps:outdated-backend", "deps:outdated-frontend"]

[tasks."deps:update-frontend"]
description = "Werk frontend-dependencies bij binnen hun semver-range en ververs pnpm-lock.yaml (gaat niet voorbij de gedeclareerde ranges; pas daarvoor package.json aan of wacht op Renovate)"
dir = "frontend"
run = "pnpm update -r"

# --- SBOM en beveiliging ---

[tasks."sbom:backend"]
description = "Genereer een CycloneDX-SBOM voor de backend (bouwt eerst; dependencies moeten kunnen worden opgelost)"
dir = "backend"
shell = "bash -c"
run = ["./gradlew assemble", "syft dir:. -o cyclonedx-json=sbom.cyclonedx.json"]

[tasks."sbom:frontend"]
description = "Genereer een CycloneDX-SBOM voor de frontend (leest pnpm-lock.yaml, geen build nodig)"
dir = "frontend"
run = "syft dir:. -o cyclonedx-json=sbom.cyclonedx.json"

[tasks."sbom:all"]
description = "Genereer CycloneDX-SBOM's voor backend en frontend"
depends = ["sbom:backend", "sbom:frontend"]

[tasks."security:secrets-scan"]
description = "Scan de werkmap op secrets (niet de git-historie; allowlist in .gitleaks.toml)"
run = "gitleaks detect --source . --no-banner --no-git --config .gitleaks.toml"

[tasks."security:frontend-vuln-scan"]
description = "Genereer de frontend-SBOM en scan die op bekende kwetsbaarheden (faalt op high/critical)"
depends = ["sbom:frontend"]
run = "grype sbom:frontend/sbom.cyclonedx.json --fail-on high"

[tasks."security:backend-vuln-scan"]
description = "Genereer de backend-SBOM en scan die op bekende kwetsbaarheden (faalt op high/critical)"
depends = ["sbom:backend"]
run = "grype sbom:backend/sbom.cyclonedx.json --fail-on high"

[tasks."security:verify-dependencies"]
description = "Genereer backend/gradle/verification-metadata.xml opnieuw (sha256 van elke opgeloste dependency); draai na elke dependency-bump, ook de wekelijkse Renovate-PR, en commit het resultaat"
dir = "backend"
shell = "bash -c"
run = "./gradlew --write-verification-metadata sha256 build -x integrationTest --continue"

[tasks."security:license-report"]
description = "Genereer het licentierapport van de backend-dependencies (laat de build niet falen; zie site/development/workflows/dependency-updates.md §3)"
dir = "backend"
shell = "bash -c"
run = "./gradlew generateLicenseReport"

[tasks."security:check-license"]
description = "Toets de licenties van backend-dependencies aan de allowlist (backend/gradle/license-report/allowed-licenses.json)"
dir = "backend"
shell = "bash -c"
run = "./gradlew checkLicense"

# security:strix-scan staat in mise-tasks/security/strix-scan

# --- Onderhoud en release ---

[tasks."sonar:issues"]
description = "Toon open SonarCloud-Bug-issues van beide projecten, gegroepeerd per regel (geef BUG/CODE_SMELL/VULNERABILITY mee om het type te wijzigen)"
run = "node scripts/sonar-issues.mjs"

[tasks."release:cut-rc"]
description = "Bepaal de volgende SemVer-versie uit Conventional Commits sinds de laatste tag, werk version.txt + CHANGELOG.md bij en commit beide op een nieuwe rc/<versie>-branch (pusht niet; zie ADR 0004)"
run = "node scripts/release-cut-rc.mjs"
