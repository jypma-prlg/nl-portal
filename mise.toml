[tools]
# Keep in sync with frontend/package.json's "packageManager" field.
pnpm = "11.28.8"
# javaVersion in backend/gradle.properties is leading; `mise run java:check-version` (CI) fails on a mismatch.
java = "temurin-25"
syft = "1.55.0"
grype = "0.121.0"
gitleaks = "8.30.1"

[tasks."docs:test"]
description = "Run the docs site's navigation-structure tests (ADR 0006)"
dir = "site"
run = "pnpm install && pnpm run test"

[tasks."docs:build"]
description = "Build the docs site, failing on any broken internal link or anchor"
dir = "site"
depends = ["docs:test"]
run = "pnpm install && pnpm run build"

[tasks."docs:dev"]
description = "Preview the docs site locally"
dir = "site"
run = "pnpm install && pnpm run dev"

[tasks."compliance:check"]
description = "Fail when a normative-source ID is unknown or a source has no check or deviation decision (site/compliance/normatieve-bronnen.md)"
run = "node scripts/check-compliance.mjs"

[tasks."likec4:validate"]
description = "Validate the LikeC4 architecture model (site/likec4)"
run = "npx --yes likec4@1.60.0 validate site/likec4"

[tasks."likec4:start"]
description = "Preview the LikeC4 architecture model in a local dev server"
run = "npx --yes likec4@1.60.0 start site/likec4"

[tasks."likec4:export"]
description = "Export the LikeC4 views to PNG under site/architectuur/img/likec4 (shown on the C4-model page; re-run and commit after changing the model)"
run = "npx --yes likec4@1.60.0 export png site/likec4 --output site/architectuur/img/likec4"

[tasks."java:check-version"]
description = "Fail when mise, Dockerfile, README or workflows name another Java version than javaVersion in backend/gradle.properties"
run = "node scripts/check-java-version.mjs"

[tasks."backend:pitest"]
description = "Mutation testing op backend/core (ADR 0011); HTML-rapport in backend/core/build/reports/pitest"
dir = "backend"
run = "./gradlew :core:pitest"

[tasks."backend:pitest-changed"]
description = "Pitest op core-klassen die t.o.v. origin/main gewijzigd zijn, met de PR-drempel van 80% (zoals CI, ADR 0011)"
dir = "backend"
shell = "bash -c"
run = '''
set -euo pipefail
git fetch -q origin main
changed=$(git diff --name-only --diff-filter=AMR origin/main...HEAD -- 'core/src/main/kotlin/**/*.kt' \
  | sed -E 's#^backend/core/src/main/kotlin/##; s#\.kt$#*#; s#/#.#g' | paste -sd, -)
if [ -z "$changed" ]; then echo "Geen gewijzigde core-klassen."; exit 0; fi
./gradlew :core:pitest -PpitestTargetClasses="$changed" -PpitestThreshold=80 --console=plain
'''

[tasks."backend:module-layer-changes"]
description = "Toon nieuwe backend-modules en laagwijzigingen in ModuleLayers t.o.v. origin/main (zoals de PR-opmerking uit CI, #177)"
dir = "backend"
shell = "bash -c"
run = "./gradlew :architecture-test:moduleLayerChanges -q"

[tasks."arch:diagram:backend"]
description = "Genereer het PlantUML-diagram van backend-modules, lagen en regeldekking (site/architectuur/img/plantuml/modules.puml) (#386)"
dir = "backend"
shell = "bash -c"
run = "./gradlew :architecture-test:architectureDiagram --console=plain"

[tasks."arch:diagram:frontend"]
description = "Genereer het PlantUML-diagram van de frontend-packages (site/architectuur/img/plantuml/frontend.puml) (#386)"
run = "node scripts/generate-frontend-diagram.mjs"

[tasks."arch:diagram"]
description = "Genereer de PlantUML-diagrammen van backend en frontend; commit het resultaat, en draai arch:diagram:render voor de SVG (#386)"
depends = ["arch:diagram:backend", "arch:diagram:frontend"]

[tasks."arch:diagram:render"]
description = "Render beide PlantUML-diagrammen naar SVG via Docker (site/architectuur/img/plantuml/*.svg); draai eerst arch:diagram (#386)"
shell = "bash -c"
run = """
for name in modules frontend; do
  docker run --rm -i plantuml/plantuml:1.2025.4 -tsvg -pipe < site/architectuur/img/plantuml/$name.puml > site/architectuur/img/plantuml/$name.svg
done
"""

[tasks."backend:integration-test"]
description = "Backend-integratietests over alle modules (vereist Docker voor de OpenKlant-container in zgw:openklant)"
dir = "backend"
shell = "bash -c"
run = "./gradlew integrationTest --continue"

[tasks."backend:integration-test-app"]
description = "Backend-integratietests alleen voor :app (sneller)"
dir = "backend"
shell = "bash -c"
run = "./gradlew :app:integrationTest"

[tasks."deps:check-backend"]
description = "List available backend dependency updates (does not apply them)"
dir = "backend"
shell = "bash -c"
run = "./gradlew dependencyUpdates -Drevision=release"

[tasks."deps:check-frontend"]
description = "List available frontend dependency updates (does not apply them)"
dir = "frontend"
run = "pnpm outdated -r"

[tasks."deps:check"]
description = "List available backend + frontend dependency updates"
depends = ["deps:check-backend", "deps:check-frontend"]

[tasks."deps:update-backend"]
description = "List available backend dependency updates (backend has no dependency locking - versions are pinned in Dependencies.kt/Versions.kt, so bumping them is a manual edit or left to Renovate; this is an alias for deps:check-backend)"
dir = "backend"
shell = "bash -c"
run = "./gradlew dependencyUpdates -Drevision=release"

[tasks."deps:update-frontend"]
description = "Update frontend dependencies within their existing semver range and refresh pnpm-lock.yaml (does not bump past declared ranges; for that, edit package.json or wait for Renovate)"
dir = "frontend"
run = "pnpm update -r"

[tasks."deps:update"]
description = "Update frontend dependencies in-range; list backend updates for manual review (see deps:update-backend, deps:update-frontend)"
depends = ["deps:update-backend", "deps:update-frontend"]

[tasks."sbom:backend"]
description = "Generate a CycloneDX SBOM for the backend (builds first, dependencies must be resolved)"
dir = "backend"
shell = "bash -c"
run = ["./gradlew assemble", "syft dir:. -o cyclonedx-json=sbom.cyclonedx.json"]

[tasks."sbom:frontend"]
description = "Generate a CycloneDX SBOM for the frontend (reads pnpm-lock.yaml, no build needed)"
dir = "frontend"
run = "syft dir:. -o cyclonedx-json=sbom.cyclonedx.json"

[tasks."sbom:all"]
description = "Generate CycloneDX SBOMs for both backend and frontend"
depends = ["sbom:backend", "sbom:frontend"]

[tasks."security:secrets-scan"]
description = "Scan the working tree for secrets (not git history; see .gitleaks.toml for the allowlist)"
run = "gitleaks detect --source . --no-banner --no-git --config .gitleaks.toml"

[tasks."security:frontend-vuln-scan"]
description = "Generate the frontend SBOM and scan it for known vulnerabilities (fails on high/critical)"
depends = ["sbom:frontend"]
run = "grype sbom:frontend/sbom.cyclonedx.json --fail-on high"

[tasks."security:backend-vuln-scan"]
description = "Generate the backend SBOM and scan it for known vulnerabilities (fails on high/critical)"
depends = ["sbom:backend"]
run = "grype sbom:backend/sbom.cyclonedx.json --fail-on high"

[tasks."sonar:issues"]
description = "List open SonarCloud Bug issues for both projects, grouped by rule (pass BUG/CODE_SMELL/VULNERABILITY as an arg to change the type)"
run = "node scripts/sonar-issues.mjs"

[tasks."release:cut-rc"]
description = "Compute the next SemVer version from Conventional Commits since the last tag, update version.txt + CHANGELOG.md, and commit both on a new rc/<version> branch (does not push; see ADR 0004)"
run = "node scripts/release-cut-rc.mjs"

[tasks."security:verify-dependencies"]
description = "Regenerate backend/gradle/verification-metadata.xml (sha256 checksums for every resolved dependency) - run after any dependency bump, including the weekly Renovate PR, and commit the result"
dir = "backend"
shell = "bash -c"
run = "./gradlew --write-verification-metadata sha256 build -x integrationTest --continue"

[tasks."security:license-report"]
description = "Generate the backend dependency-license report (does not fail the build; see site/development/workflows/dependency-updates.md §3)"
dir = "backend"
shell = "bash -c"
run = "./gradlew generateLicenseReport"

[tasks."security:strix-scan"]
description = "Run the Strix agentic security scan locally (quick mode, scoped to the diff against main); requires the strix CLI (see https://docs.strix.ai/quickstart), Docker running, and STRIX_LLM/LLM_API_KEY set"
shell = "bash -c"
run = """
command -v strix >/dev/null || { echo "strix CLI not found - install it first: https://docs.strix.ai/quickstart (e.g. 'pipx install strix-agent')" >&2; exit 1; }
: "${STRIX_LLM:?Set STRIX_LLM}"
: "${LLM_API_KEY:?Set LLM_API_KEY}"
strix --target ./ --scan-mode quick --scope-mode diff --fail-on high
"""

[tasks."security:check-license"]
description = "Check backend dependency licenses against the allowlist (backend/gradle/license-report/allowed-licenses.json) - known broken on main, see site/development/workflows/periodic-checks.md"
dir = "backend"
shell = "bash -c"
run = "./gradlew checkLicense"

[tasks."docs:capabilities"]
description = "Regenerate arc42 chapters 5/11 and site/likec4/capabilities.generated.c4 from docs/capabilities.yaml"
run = "node scripts/generate-capabilities-docs.mjs"

[tasks."docs:capabilities-check"]
description = "Regenerate capability docs and fail if that changes anything (CI freshness check)"
depends = ["docs:capabilities"]
shell = "bash -c"
run = "git diff --ignore-cr-at-eol --exit-code -- site/architectuur/arc42 site/likec4 && test -z \"$(git ls-files --others --exclude-standard -- site/architectuur/arc42 site/likec4)\" || { echo 'Capability-docs niet actueel: draai `mise run docs:capabilities` en commit het resultaat.'; exit 1; }"

# Migratiehulp voor de repo-transfer (#19); verwijderd in het opruimticket na afronding.

[tasks."transfer:voor"]
description = "Transfer #19, fase 1: controle, momentopname en voorbereiding (verplaatst niets)"
run = "bash scripts/transfer/transfer-wizard.sh voor"

[tasks."transfer:uitvoeren"]
description = "Transfer #19, fase 2: de GitHub-transfer naar pinkroccade uitvoeren"
run = "bash scripts/transfer/transfer-wizard.sh uitvoeren"

[tasks."transfer:na"]
description = "Transfer #19, fase 3: inrichten, verwijzingen omzetten en acceptatiechecks na de transfer"
run = "bash scripts/transfer/transfer-wizard.sh na"
