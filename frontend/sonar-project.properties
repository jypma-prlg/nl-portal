sonar.projectKey=pinkroccade_nl-portal-frontend
sonar.projectName=nl-portal-frontend
sonar.organization=pinkroccade

sonar.sources=packages/api/src,packages/authentication/src,packages/localization/src,packages/user-interface/src
sonar.tests=packages/api/src,packages/authentication/src,packages/localization/src,packages/user-interface/src
sonar.test.inclusions=**/tests/**,**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=\
  packages/api/coverage/lcov.info,\
  packages/authentication/coverage/lcov.info,\
  packages/localization/coverage/lcov.info,\
  packages/user-interface/coverage/lcov.info

# Test files are declared above via sonar.tests + sonar.test.inclusions (same root as
# sonar.sources, since tests live alongside production code under src/tests/). Excluding the same
# pattern here keeps them from also being double-counted as main source, which is what caused
# new test files to drag down the new_coverage quality-gate metric (a test file's own lines were
# being required to be "covered by a test" - a 0%-forever metric for test code).
sonar.exclusions=**/generated/**,**/node_modules/**,**/tests/**,**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/generated/**,**/node_modules/**

sonar.sourceEncoding=UTF-8
