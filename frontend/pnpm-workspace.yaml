packages:
  - "./packages/**"

allowBuilds:
  "@parcel/watcher": true
  core-js: false
  esbuild: true

# Configure pnpm so peer dependencies must be explicitly added instead of being automatically installed.
autoInstallPeers: false

# Configure pnpm so it only installs package versions that have been published on the npm registry for at least 24 hours
# (1440 minutes). This helps mitigate the risk of supply chain attacks by avoiding newly published, potentially
# malicious versions. Keep this in sync with npm-check-updates's `cooldown` configuration.
minimumReleaseAge: 1440

# Make an exception for trusted packages, notably our own
minimumReleaseAgeExclude:
  - "@gemeente-denhaag/*"
  - "@utrecht/*"

# Configure pnpm to save exact version numbers (not including ^ or ~) in package.json. Lock dependencies to specific
# versions to ensure reproducible installs and prevent automatic upgrades to newer minor or patch releases.
saveExact: true
savePrefix: ""

# Configure pnpm to not fail when there are missing or invalid peer dependencies in the tree.
strictPeerDependencies: false

overrides:
  # Rolldown 1.2.12 triggers library watch rebuilds on its own dist output.
  rolldown: 1.2.15
  uuid@9: 11.1.1
  lodash-es: 4.18.1
  # Critical CVE (GHSA-pqg4-j6r4-53mv), pulled in transitively via
  # @graphql-codegen/cli (devDependency only). Fixed in 1.11.0, pinning to latest.
  shell-quote: 1.12.0
  # The following pin to each advisory's minimum fixed version (not "latest"), consistent
  # with minimumReleaseAge above: prefer an established fix over an unvetted brand-new release.
  # All transitive via @graphql-codegen/cli, eslint, stylelint, vitest or wait-on (devDependencies only).
  "@fastify/busboy": 3.2.4 # GHSA-xjh9-v7x6-24jw, GHSA-x8mw-p69m-v3mx, GHSA-gxm5-99cw-xjw9
  follow-redirects: 1.16.2 # GHSA-8r9p-f939-6h3c, GHSA-q3jh-wrc6-jgq8
  # GHSA-7mx3-vvmw-hjmv's 12.0.1 pin is itself vulnerable to GHSA-c4qx-w738-7hr3 (10.10.1-12.0.1);
  # no fixed 12.x release exists, only 13.0.0+, so this pin now crosses a major line.
  "@graphql-tools/utils": 13.2.0 # GHSA-c4qx-w738-7hr3
  source-map-js: 1.2.2 # GHSA-68fv-2mgg-jv7q
  brace-expansion@1: 1.1.21 # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr
  brace-expansion@5: 5.0.12 # idem, 5.x line (both lines resolve independently in the tree)
  postcss-selector-parser: 7.1.7 # GHSA-rj75-hqrm-r3gf
  "@graphql-tools/executor-legacy-ws": 1.1.39 # GHSA-6fw5-9hq8-w87g
  moment: 2.31.0 # GHSA-4p3w-j4w9-5jqw - transitive via @formio/js, this one IS shipped
  vite: 8.3.5 # GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw
  dompurify: 3.4.17 # GHSA-mrv2-3pqr-j5jr, GHSA-cg2g-xh64-v4q7
  undici: 8.12.3 # GHSA-xjj6-f33q-929c
  zod: 4.6.7 # GHSA-mrhx-c7xc-m3w5
  # braces 3.0.3 (GHSA-vfj7-8cjw-p6xm) has no fixed version published yet - can't override,
  # see docs/workflows/security.md for the follow-up.
