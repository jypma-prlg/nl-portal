server:
    port: 8080

management:
    # Beheerpoort apart zetten: MANAGEMENT_SERVER_PORT=8091 (zie site/hosting-en-configuratie/beheer-modulestatus.md)
    # Beheerpoort apart zetten: MANAGEMENT_SERVER_PORT=8091 (zie site/hosting-en-configuratie/beheer-modulestatus.md)
    endpoint:
        health:
            access: read_only
            probes:
                enabled: true
        modulestatus:
            access: read_only
    endpoints:
        access:
            default: none
        web:
            exposure:
                include: health, modulestatus

spring:
    application:
        name: nl-portal-app
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${JWKS_URI}
    graphql:
        graphiql:
            enabled: false
        schema:
            locations: classpath*:graphql/**/
            introspection:
                enabled: false

graphql:
    packages:
        - "nl.nlportal"

logging:
    level:
        root: ${LOGLEVEL:INFO}

nl-portal:
    authentication:
        keycloak:
            resource: ${KEYCLOAK_CLIENT_ID}
            audience: ${KEYCLOAK_TOKEN_EXCHANGE_AUDIENCE:}
            credentials:
                secret: ${KEYCLOAK_CLIENT_SECRET}
        machtingsdienst:
            resource-url: # classpath:example-machtigingsdiensten.json
    security:
        endpoints:
            unsecured: /api/public/**
    frontend:
        modules-whitelist:
            - zakenapi
            - product
            - haalcentraal-brp
            - taak
            - openproduct
