server:
    port: 8080

management:
    # Beheerpoort apart zetten: MANAGEMENT_SERVER_PORT=8091 (zie site/hosting-en-configuratie/beheer-modulestatus.md)
    # Beheerpoort apart zetten: MANAGEMENT_SERVER_PORT=8091 (zie site/hosting-en-configuratie/beheer-modulestatus.md)
    endpoint:
        health:
            access: read_only
            probes:
                enabled: true
        modulestatus:
            access: read_only
    endpoints:
        access:
            default: none
        web:
            exposure:
                include: health, modulestatus

spring:
    application:
        name: nl-portal-app-dev
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: http://localhost:8082/auth/realms/nlportal/protocol/openid-connect/certs
    graphql:
        graphiql:
            enabled: true
        schema:
            locations: classpath*:graphql/**/
            introspection:
                enabled: true

graphql:
    packages:
        - "nl.nlportal"

logging:
    level:
        root: DEBUG

