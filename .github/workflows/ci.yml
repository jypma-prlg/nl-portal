name: CI

on:
    pull_request:
        branches:
            - main
            - "release/*.x"

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            backend: ${{ steps.filter.outputs.backend }}
            frontend: ${{ steps.filter.outputs.frontend }}
            scripts: ${{ steps.filter.outputs.scripts }}
            workflows: ${{ steps.filter.outputs.workflows }}
            docsOnly: ${{ steps.filter.outputs.backend == 'false' && steps.filter.outputs.frontend == 'false' && steps.filter.outputs.scripts == 'false' && steps.filter.outputs.workflows == 'false' && steps.filter.outputs.docs == 'true' }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
                id: filter
                with:
                    filters: |
                        backend:
                            - 'backend/**'
                        frontend:
                            - 'frontend/**'
                        scripts:
                            - 'scripts/**'
                        workflows:
                            - '.github/workflows/**'
                        docs:
                            - 'docs/**'
                            - '*.md'
                            - 'GLOSSARY.md'

    validate:
        needs: changes
        uses: ./.github/workflows/_validate-build.yml
        with:
            runBackend: ${{ needs.changes.outputs.backend == 'true' }}
            runFrontend: ${{ needs.changes.outputs.frontend == 'true' }}

    test-scripts:
        needs: changes
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up Node.js
                uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
                with:
                    node-version: "24"
            -   name: Run scripts tests
                run: node --test "scripts/**/*.test.mjs"

    ci-required:
        needs: [changes, validate, test-scripts]
        if: always()
        runs-on: ubuntu-latest
        steps:
            -   name: Aggregate result
                env:
                    VALIDATE_RESULT: ${{ needs.validate.result }}
                    SCRIPTS_RESULT: ${{ needs.test-scripts.result }}
                run: |
                    echo "::notice::validate result = ${VALIDATE_RESULT}"
                    echo "::notice::test-scripts result = ${SCRIPTS_RESULT}"
                    if [ "${VALIDATE_RESULT}" = "failure" ] || [ "${VALIDATE_RESULT}" = "cancelled" ]; then
                      exit 1
                    fi
                    if [ "${SCRIPTS_RESULT}" = "failure" ] || [ "${SCRIPTS_RESULT}" = "cancelled" ]; then
                      exit 1
                    fi

    fast-track-label:
        needs: [changes, ci-required]
        if: always()
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            -   name: Apply or remove fast-track-ready label
                env:
                    GH_TOKEN: ${{ github.token }}
                    REPO: ${{ github.repository }}
                    PR_NUMBER: ${{ github.event.pull_request.number }}
                    PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                    CI_RESULT: ${{ needs.ci-required.result }}
                    DOCS_ONLY: ${{ needs.changes.outputs.docsOnly }}
                    TOUCHES_WORKFLOWS: ${{ needs.changes.outputs.workflows }}
                run: |
                    # Renovate's weekly non-major dependency-group PRs are the only ones this
                    # author check needs to catch: major updates are disabled repo-wide in
                    # renovate.json (matchUpdateTypes: major -> enabled: false), so any
                    # renovate[bot] PR is non-major by construction - no separate per-PR check.
                    RENOVATE_NON_MAJOR=false
                    if [ "${PR_AUTHOR}" = "renovate[bot]" ] && [ "${TOUCHES_WORKFLOWS}" = "false" ]; then
                      RENOVATE_NON_MAJOR=true
                    fi

                    if [ "${CI_RESULT}" = "success" ] && { [ "${DOCS_ONLY}" = "true" ] || [ "${RENOVATE_NON_MAJOR}" = "true" ]; }; then
                      gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label fast-track-ready
                    else
                      gh pr edit "${PR_NUMBER}" --repo "${REPO}" --remove-label fast-track-ready
                    fi
