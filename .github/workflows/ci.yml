name: CI

on:
    pull_request:
        branches:
            - main
            - "release/*.x"

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            backend: ${{ steps.filter.outputs.backend }}
            frontend: ${{ steps.filter.outputs.frontend }}
            scripts: ${{ steps.filter.outputs.scripts }}
            workflows: ${{ steps.filter.outputs.workflows }}
            docs: ${{ steps.filter.outputs.docs }}
            docsOnly: ${{ steps.filter.outputs.backend == 'false' && steps.filter.outputs.frontend == 'false' && steps.filter.outputs.scripts == 'false' && steps.filter.outputs.workflows == 'false' && steps.filter.outputs.docs == 'true' }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
                id: filter
                with:
                    filters: |
                        backend:
                            - 'backend/**'
                        frontend:
                            - 'frontend/**'
                        scripts:
                            - 'scripts/**'
                        workflows:
                            - '.github/workflows/**'
                        docs:
                            - 'docs/**'
                            - 'site/**'
                            - '*.md'
                            - 'GLOSSARY.md'

    validate:
        needs: changes
        uses: ./.github/workflows/_validate-build.yml
        with:
            runBackend: ${{ needs.changes.outputs.backend == 'true' }}
            runFrontend: ${{ needs.changes.outputs.frontend == 'true' }}

    # Places, updates or removes one PR comment asking reviewers to confirm new modules and layer
    # changes in ModuleLayers (#177). No comment when there is nothing to ask. Skipped for forks:
    # their token cannot write comments; the summary is still in the build job's step summary.
    # Runs whatever the frontend result; without a fresh summary (backend build or summary step
    # failed) the existing comment is left alone.
    module-layers-comment:
        needs: [changes, validate]
        if: ${{ always() && needs.changes.outputs.backend == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            -   id: download
                continue-on-error: true
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    name: module-layers-summary
            -   name: Place, update or remove the PR comment
                if: ${{ steps.download.outcome == 'success' }}
                env:
                    GH_TOKEN: ${{ github.token }}
                    REPO: ${{ github.repository }}
                    PR_NUMBER: ${{ github.event.pull_request.number }}
                run: |
                    MARKER='<!-- module-layers-summary -->'
                    EXISTING=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
                      --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id")
                    EXISTING="${EXISTING%%$'\n'*}"
                    if [ -s pr-summary.md ]; then
                      { echo "${MARKER}"; cat pr-summary.md; } > body.md
                      if [ -n "${EXISTING}" ]; then
                        gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING}" -F body=@body.md > /dev/null
                      else
                        gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@body.md > /dev/null
                      fi
                    elif [ -n "${EXISTING}" ]; then
                      gh api -X DELETE "repos/${REPO}/issues/comments/${EXISTING}"
                    fi

    test-scripts:
        needs: changes
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up Node.js
                uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
                with:
                    node-version: "24"
            -   name: Run scripts tests
                run: node --test "scripts/**/*.test.mjs"

    java-version-consistent:
        needs: changes
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.docs == 'true' }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up Node.js
                uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
                with:
                    node-version: "24"
            -   name: Check that the Java version is consistent
                run: node scripts/check-java-version.mjs

    compliance-register-consistent:
        needs: changes
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.docs == 'true' }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up Node.js
                uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
                with:
                    node-version: "24"
            -   name: Check the register of normative sources (N-CG-5LAGEN, N-ASVS-5.0, ...)
                run: node scripts/check-compliance.mjs

    capabilities-docs-fresh:
        needs: changes
        if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.scripts == 'true' }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up mise
                uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
            -   name: Regenerate capability docs and fail on diff
                run: mise run docs:capabilities-check
            -   name: Validate LikeC4 model incl. generated capabilities
                run: mise run likec4:validate

    docs-site:
        needs: changes
        if: ${{ needs.changes.outputs.docs == 'true' }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up mise
                uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
            -   name: Build docs site (navigation tests, dead-link and anchor check)
                run: mise run docs:build

    ci-required:
        needs: [changes, validate, test-scripts, java-version-consistent, capabilities-docs-fresh, compliance-register-consistent, docs-site]
        if: always()
        runs-on: ubuntu-latest
        steps:
            -   name: Aggregate result
                env:
                    VALIDATE_RESULT: ${{ needs.validate.result }}
                    SCRIPTS_RESULT: ${{ needs.test-scripts.result }}
                    JAVA_VERSION_RESULT: ${{ needs.java-version-consistent.result }}
                    CAPABILITIES_RESULT: ${{ needs.capabilities-docs-fresh.result }}
                    COMPLIANCE_RESULT: ${{ needs.compliance-register-consistent.result }}
                    DOCS_SITE_RESULT: ${{ needs.docs-site.result }}
                run: |
                    echo "::notice::validate result = ${VALIDATE_RESULT}"
                    echo "::notice::test-scripts result = ${SCRIPTS_RESULT}"
                    echo "::notice::java-version-consistent result = ${JAVA_VERSION_RESULT}"
                    echo "::notice::capabilities-docs-fresh result = ${CAPABILITIES_RESULT}"
                    echo "::notice::compliance-register-consistent result = ${COMPLIANCE_RESULT}"
                    echo "::notice::docs-site result = ${DOCS_SITE_RESULT}"
                    if [ "${VALIDATE_RESULT}" = "failure" ] || [ "${VALIDATE_RESULT}" = "cancelled" ]; then
                      exit 1
                    fi
                    if [ "${SCRIPTS_RESULT}" = "failure" ] || [ "${SCRIPTS_RESULT}" = "cancelled" ]; then
                      exit 1
                    fi
                    if [ "${JAVA_VERSION_RESULT}" = "failure" ] || [ "${JAVA_VERSION_RESULT}" = "cancelled" ]; then
                      exit 1
                    fi
                    if [ "${CAPABILITIES_RESULT}" = "failure" ] || [ "${CAPABILITIES_RESULT}" = "cancelled" ]; then
                      exit 1
                    fi
                    if [ "${COMPLIANCE_RESULT}" = "failure" ] || [ "${COMPLIANCE_RESULT}" = "cancelled" ]; then
                      exit 1
                    fi
                    if [ "${DOCS_SITE_RESULT}" = "failure" ] || [ "${DOCS_SITE_RESULT}" = "cancelled" ]; then
                      exit 1
                    fi

    fast-track-label:
        needs: [changes, ci-required]
        if: always()
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            -   name: Apply or remove fast-track-ready label
                env:
                    GH_TOKEN: ${{ github.token }}
                    REPO: ${{ github.repository }}
                    PR_NUMBER: ${{ github.event.pull_request.number }}
                    PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                    CI_RESULT: ${{ needs.ci-required.result }}
                    DOCS_ONLY: ${{ needs.changes.outputs.docsOnly }}
                    TOUCHES_WORKFLOWS: ${{ needs.changes.outputs.workflows }}
                run: |
                    # Renovate's weekly non-major dependency-group PRs are the only ones this
                    # author check needs to catch: major updates are disabled repo-wide in
                    # renovate.json (matchUpdateTypes: major -> enabled: false), so any
                    # renovate[bot] PR is non-major by construction - no separate per-PR check.
                    RENOVATE_NON_MAJOR=false
                    if [ "${PR_AUTHOR}" = "renovate[bot]" ] && [ "${TOUCHES_WORKFLOWS}" = "false" ]; then
                      RENOVATE_NON_MAJOR=true
                    fi

                    if [ "${CI_RESULT}" = "success" ] && { [ "${DOCS_ONLY}" = "true" ] || [ "${RENOVATE_NON_MAJOR}" = "true" ]; }; then
                      gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label fast-track-ready
                    else
                      gh pr edit "${PR_NUMBER}" --repo "${REPO}" --remove-label fast-track-ready
                    fi
