name: Secret scan

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    issues: write

concurrency:
    group: secret-scan-${{ github.ref }}
    cancel-in-progress: true

env:
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    secret-scan:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up mise
                uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
                with:
                    install_args: "gitleaks"
            -   name: Set up Node.js
                uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
                with:
                    node-version: "24"
            -   name: Scan the working tree for secrets
                run: mise run security:secrets-scan
            -   name: Genereer JSON-rapport voor escalatie
                if: always()
                run: gitleaks detect --source . --no-banner --no-git --config .gitleaks.toml --redact --report-format json --report-path gitleaks-report.json --exit-code 0
            -   name: Escaleer gevonden secrets
                if: always()
                run: node scripts/escalate-findings.mjs --source=secret-scan --report=gitleaks-report.json
