name: Secret scan

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: secret-scan-${{ github.ref }}
    cancel-in-progress: true

jobs:
    secret-scan:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up mise
                uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
                with:
                    install_args: "gitleaks"
            -   name: Scan the working tree for secrets
                run: mise run security:secrets-scan
