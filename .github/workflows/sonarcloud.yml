name: SonarCloud

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read
    issues: write

concurrency:
    group: sonarcloud-${{ github.ref }}
    cancel-in-progress: true

env:
    SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    backend:
        name: Backend analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Setup Java
                uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
                with:
                    distribution: temurin
                    java-version: 21
            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
            -   name: Run tests and SonarCloud analysis
                working-directory: backend
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: ./gradlew test jacocoTestReport sonar --no-daemon

    frontend:
        name: Frontend analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Set up Node.js
                uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
                with:
                    node-version: "24"
            -   name: Install
                working-directory: frontend
                run: npm install -g pnpm@11 && pnpm install
            -   name: Build
                working-directory: frontend
                run: pnpm -r build
            -   name: Test with coverage
                working-directory: frontend
                run: pnpm test:coverage
            -   name: SonarCloud scan
                uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
                with:
                    projectBaseDir: frontend

    escalate:
        name: Escalate Blocker/Critical vulnerabilities
        needs: [backend, frontend]
        # Alleen op main - een PR-analyse hoort nog niet bij "productie", en escaleren voor
        # code die nog niet gemerged is levert ruis op. SonarCloud's eigen analyse-verwerking
        # loopt soms een paar minuten achter op deze job; een gemiste bevinding komt dan op de
        # eerstvolgende push naar main alsnog naar boven (zie docs/workflows/periodic-checks.md).
        if: always() && github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up Node.js
                uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
                with:
                    node-version: "24"
            -   name: Escaleer backend
                run: node scripts/escalate-findings.mjs --source=sonarcloud --component=pinkroccade_nl-portal-backend
            -   name: Escaleer frontend
                run: node scripts/escalate-findings.mjs --source=sonarcloud --component=pinkroccade_nl-portal-frontend
