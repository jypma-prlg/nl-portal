name: Build and Publish Release

on:
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.v.outputs.version }}
            minor: ${{ steps.v.outputs.minor }}
            major: ${{ steps.v.outputs.major }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Guard branch
                run: |
                    case "${GITHUB_REF_NAME}" in
                      rc/*) : ;;
                      *) echo "::error::build-and-publish-release.yml must be dispatched from the rc/* branch being promoted (got ${GITHUB_REF_NAME})."; exit 1 ;;
                    esac
            -   name: Read release version
                id: v
                run: |
                    version=$(cat version.txt)
                    echo "version=${version}" >> "$GITHUB_OUTPUT"
                    echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
                    echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
                    echo "::notice::Release version ${version}"
            -   name: Pre-flight - release line must fast-forward
                env:
                    MAJOR: ${{ steps.v.outputs.major }}
                run: |
                    branch="release/${MAJOR}.x"
                    tip=$(git ls-remote --heads origin "${branch}" | cut -f1)
                    if [ -z "${tip}" ]; then
                      echo "::notice::${branch} does not exist yet - it will be born from ${GITHUB_SHA}."
                      exit 0
                    fi
                    git fetch origin "${branch}"
                    if git merge-base --is-ancestor "${tip}" "${GITHUB_SHA}"; then
                      echo "::notice::${branch} (${tip}) fast-forwards to ${GITHUB_SHA}."
                    else
                      echo "::error::${branch} tip ${tip} is not an ancestor of the rc commit ${GITHUB_SHA}; the line cannot fast-forward. Resolve before releasing."
                      exit 1
                    fi

    stage-be:
        needs: prepare
        uses: ./.github/workflows/_stage-be.yml
        with:
            version: ${{ needs.prepare.outputs.version }}
            runTests: false
            generateReports: true

    stage-fe:
        needs: prepare
        uses: ./.github/workflows/_stage-fe.yml
        with:
            version: ${{ needs.prepare.outputs.version }}
            runTests: false

    gate:
        needs: [prepare, stage-be, stage-fe]
        runs-on: ubuntu-latest
        environment: release
        steps:
            -   name: Approved
                env:
                    VERSION: ${{ needs.prepare.outputs.version }}
                run: echo "::notice::Release ${VERSION} approved - proceeding to publish."

    image-be:
        needs: [prepare, stage-be, gate]
        if: github.repository_owner == 'pinkroccade'
        uses: ./.github/workflows/_build-app-image.yml
        with:
            stack: backend
            push: true
            primaryTag: ghcr.io/pinkroccade/nl-portal-backend:${{ needs.prepare.outputs.version }}
            tags: |
                ghcr.io/pinkroccade/nl-portal-backend:${{ needs.prepare.outputs.version }}
                ghcr.io/pinkroccade/nl-portal-backend:${{ needs.prepare.outputs.minor }}
                ghcr.io/pinkroccade/nl-portal-backend:${{ needs.prepare.outputs.major }}
        secrets: inherit

    image-fe:
        needs: [prepare, stage-fe, gate]
        if: github.repository_owner == 'pinkroccade'
        uses: ./.github/workflows/_build-app-image.yml
        with:
            stack: frontend
            push: true
            primaryTag: ghcr.io/pinkroccade/nl-portal-frontend:${{ needs.prepare.outputs.version }}
            tags: |
                ghcr.io/pinkroccade/nl-portal-frontend:${{ needs.prepare.outputs.version }}
                ghcr.io/pinkroccade/nl-portal-frontend:${{ needs.prepare.outputs.minor }}
                ghcr.io/pinkroccade/nl-portal-frontend:${{ needs.prepare.outputs.major }}
        secrets: inherit

    create-release:
        needs: [prepare, stage-be, image-be, image-fe]
        if: github.repository_owner == 'pinkroccade'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Generate GitHub App token
                id: token
                uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
                with:
                    client-id: ${{ secrets.NL_PORTAL_APP_CLIENT_ID }}
                    private-key: ${{ secrets.NL_PORTAL_APP_PRIVATE_KEY }}
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    token: ${{ steps.token.outputs.token }}
                    fetch-depth: 0
            -   name: Advance or birth the release/<major>.x line
                env:
                    MAJOR: ${{ needs.prepare.outputs.major }}
                run: |
                    branch="release/${MAJOR}.x"
                    git push origin "${GITHUB_SHA}:refs/heads/${branch}"
                    echo "::notice::${branch} now at ${GITHUB_SHA}."
            -   name: Tag the release commit
                env:
                    VERSION: ${{ needs.prepare.outputs.version }}
                run: |
                    if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null 2>&1; then
                      echo "::notice::Tag ${VERSION} already exists - skipping."
                    else
                      git tag "${VERSION}" "${GITHUB_SHA}"
                      git push origin "refs/tags/${VERSION}"
                    fi
            -   name: Create the GitHub release
                env:
                    GH_TOKEN: ${{ steps.token.outputs.token }}
                    VERSION: ${{ needs.prepare.outputs.version }}
                run: |
                    if gh release view "${VERSION}" > /dev/null 2>&1; then
                      echo "::notice::Release ${VERSION} already exists - skipping."
                    else
                      node scripts/changelog-section.mjs "${VERSION}" > /tmp/release-notes.md
                      gh release create "${VERSION}" --title "${VERSION}" --notes-file /tmp/release-notes.md
                    fi
            -   name: Download reports + SBOM
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    name: backend-reports
                    path: reports
            -   name: Attach SBOM and reports to the GitHub release
                env:
                    GH_TOKEN: ${{ steps.token.outputs.token }}
                    VERSION: ${{ needs.prepare.outputs.version }}
                working-directory: reports
                run: |
                    tar -xf backend-reports.tar
                    mv sbom.cyclonedx.json "nl-portal-backend-${VERSION}.sbom.cyclonedx.json"
                    assets=("nl-portal-backend-${VERSION}.sbom.cyclonedx.json")
                    if [ -f build/reports/dependency-license/index.html ]; then
                      mv build/reports/dependency-license/index.html "nl-portal-backend-${VERSION}.licenses.html"
                      assets+=("nl-portal-backend-${VERSION}.licenses.html")
                    fi
                    if [ -d build/reports/project/dependencies ]; then
                      tar -czf "nl-portal-backend-${VERSION}.dependency-reports.tgz" -C build/reports/project dependencies
                      assets+=("nl-portal-backend-${VERSION}.dependency-reports.tgz")
                    fi
                    gh release upload "${VERSION}" "${assets[@]}" --clobber
            -   name: Delete the release candidate branch
                env:
                    RC_BRANCH: ${{ github.ref_name }}
                run: |
                    if git ls-remote --exit-code --heads origin "${RC_BRANCH}" > /dev/null 2>&1; then
                      echo "::notice::Deleting ${RC_BRANCH}."
                      git push origin --delete "${RC_BRANCH}"
                    else
                      echo "::notice::${RC_BRANCH} already gone - skipping."
                    fi
