name: Publish docs site

# Publiceert de VitePress-site (site/) naar GitHub Pages: https://pinkroccade.github.io/nl-portal/
# Vereist eenmalig: repo Settings > Pages > Source = "GitHub Actions".
on:
    push:
        branches:
            - main
        paths:
            - "site/**"
            - "docs/**"
            - ".github/workflows/publish-docs.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up mise
                uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
            -   name: Build docs site (navigation tests, dead-link and anchor check)
                run: mise run docs:build
                env:
                    DOCS_BASE: /nl-portal/
            -   name: Upload Pages artifact
                uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
                with:
                    path: site/.vitepress/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            -   name: Deploy to GitHub Pages
                id: deployment
                uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
