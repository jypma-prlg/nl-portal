name: Strix security scan

on:
    pull_request:
        paths-ignore:
            - "docs/**"
            - "documentation/**"
            - "site/**"
            - "*.md"
            - "GLOSSARY.md"
    push:
        branches: [main]
        paths-ignore:
            - "docs/**"
            - "documentation/**"
            - "site/**"
            - "*.md"
            - "GLOSSARY.md"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: strix-scan-${{ github.ref }}
    cancel-in-progress: true

env:
    # Deliberate pins, bump both together on a reviewed Strix upgrade (see "Install Strix" below).
    STRIX_VERSION: "1.7.0"
    STRIX_ASSET_SHA256: "b8cd7e84d63cbeff6726301a9e08fddedf40fc6a4edcdb4edda8a853b3312de6"
    STRIX_SANDBOX_IMAGE: "ghcr.io/usestrix/strix-sandbox:1.3.1"
    STRIX_SANDBOX_DIGEST: "sha256:efd7f18980c126700ddf55f6d0c0c86436d8d20908f4e1252cb761212749ded5"

jobs:
    strix-scan:
        # Pinned (not ubuntu-latest): ubuntu-latest is mid-rollover to ubuntu-26.04, and Strix's
        # Docker-based sandbox crashed on that image with a sqlite3 "unable to open database file"
        # error mid-scan (likely a container/user-namespace behavior change, as seen with the
        # 22.04 -> 24.04 move). Re-evaluate once Strix confirms 26.04 support.
        runs-on: ubuntu-24.04
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Cache Strix binary
                id: strix-bin-cache
                uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: ~/.strix/bin
                    key: strix-bin-${{ env.STRIX_VERSION }}-${{ env.STRIX_ASSET_SHA256 }}
            -   name: Install Strix (pinned release, checksum-verified)
                if: steps.strix-bin-cache.outputs.cache-hit != 'true'
                # Deliberately not "curl | bash" against the upstream installer: that resolves and
                # executes whatever strix.ai serves at request time, unpinned and unverified, in a
                # job that carries our LLM credentials - the same risk this scan itself flagged
                # (CVSS 9.9) against the first version of this workflow. Downloads the exact
                # release asset and verifies it against the sha256 GitHub publishes for it, same
                # standard as this repo's SHA-pinned Actions and Gradle's verification-metadata.xml.
                run: |
                    curl -fsSL -o strix.tar.gz \
                        "https://github.com/usestrix/strix/releases/download/v${STRIX_VERSION}/strix-${STRIX_VERSION}-linux-x86_64.tar.gz"
                    echo "${STRIX_ASSET_SHA256}  strix.tar.gz" | sha256sum --check -
                    mkdir -p "$HOME/.strix/bin"
                    tar -xzf strix.tar.gz -C "$HOME/.strix/bin"
                    mv "$HOME/.strix/bin/strix-${STRIX_VERSION}-linux-x86_64" "$HOME/.strix/bin/strix"
                    chmod +x "$HOME/.strix/bin/strix"
                    rm strix.tar.gz
            -   name: Add Strix to PATH
                run: echo "$HOME/.strix/bin" >> "$GITHUB_PATH"
            -   name: Cache sandbox image
                id: sandbox-image-cache
                uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: ~/strix-sandbox-image.tar
                    key: strix-sandbox-${{ env.STRIX_SANDBOX_DIGEST }}
            -   name: Pin the sandbox image by digest
                # Strix pulls its sandbox image by mutable tag with no digest check (the other half
                # of the same finding). Pulling it ourselves by digest and tagging it locally with
                # the tag Strix expects means its image_exists() check finds our verified image
                # cached and never re-resolves the floating tag.
                run: |
                    if [ "${{ steps.sandbox-image-cache.outputs.cache-hit }}" = "true" ]; then
                        docker load -i ~/strix-sandbox-image.tar
                    else
                        docker pull --platform linux/amd64 "${STRIX_SANDBOX_IMAGE%:*}@${STRIX_SANDBOX_DIGEST}"
                        docker save -o ~/strix-sandbox-image.tar "${STRIX_SANDBOX_IMAGE%:*}@${STRIX_SANDBOX_DIGEST}"
                    fi
                    docker tag "${STRIX_SANDBOX_IMAGE%:*}@${STRIX_SANDBOX_DIGEST}" "${STRIX_SANDBOX_IMAGE}"
            -   name: Run agentic security scan (PR diff scope)
                env:
                    STRIX_LLM: ${{ secrets.STRIX_LLM }}
                    LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
                    LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
                run: strix -n -t ./ --scan-mode quick --scope-mode diff --fail-on high
            -   name: Upload scan report
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: strix-scan-report
                    path: strix_runs/
                    retention-days: 7

    # See ADR 0008: publishes only aggregate severity counts (never finding titles, CVEs or
    # locations) to the public docs site, generated automatically so no manual curation of
    # scan results is ever required.
    publish-security-status:
        needs: strix-scan
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            pull-requests: write
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Download scan report
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    name: strix-scan-report
                    path: strix_runs
            -   name: Aggregate severity counts
                run: |
                    python3 scripts/aggregate-strix-status.py \
                        --runs-dir strix_runs \
                        --out site/compliance/security-status.md
            -   name: Open PR with updated security status
                uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
                with:
                    commit-message: "docs(compliance): update security scan status"
                    title: "docs(compliance): update security scan status"
                    body: >
                        Automated update of the aggregated Strix severity counts in
                        `site/compliance/security-status.md`, generated from the latest scan of
                        `main`. No finding details are included — see ADR 0008.
                    branch: automated/security-status
                    delete-branch: true
                    add-paths: site/compliance/security-status.md
