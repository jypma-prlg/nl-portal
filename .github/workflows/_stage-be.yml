name: _stage-be

on:
    workflow_call:
        inputs:
            version:
                description: "The channel-decorated version to stamp."
                type: string
                required: true
            runTests:
                description: "Run the unit + integration test matrix. Release sets false (the RC already passed it on this commit)."
                type: boolean
                default: true
            generateReports:
                description: "Produce the license/dependency reports + SBOM (release)."
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    stage:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up mise (java uit mise.toml)
                uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
                with:
                    install_args: "java"
            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
            -   name: License + dependency reports
                if: ${{ inputs.generateReports }}
                # Block scalar: onge-quote ": " in ":::" is ongeldige YAML (#370)
                run: |
                    mise run security:check-license ::: backend:dependency-report
            -   name: Build + stage
                working-directory: backend
                env:
                    VERSION: ${{ inputs.version }}
                    GRADLE_TASK: ${{ inputs.runTests && 'build' || 'assemble' }}
                run: ./gradlew "${GRADLE_TASK}" -Pversion="${VERSION}" --stacktrace
            -   name: Generate SBOM
                if: ${{ inputs.generateReports }}
                uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
                with:
                    path: backend
                    format: cyclonedx-json
                    output-file: backend/sbom.cyclonedx.json
                    artifact-name: nl-portal-backend-${{ inputs.version }}-sbom.cyclonedx.json
                    upload-artifact: false
                    upload-release-assets: false
                    dependency-snapshot: false
            -   name: Package stage bundle
                working-directory: backend
                run: tar -cf backend-stage.tar app/build/libs/app.jar
            -   name: Upload stage bundle
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: backend-stage
                    path: backend/backend-stage.tar
                    retention-days: 1
            -   name: Package reports + SBOM
                if: ${{ inputs.generateReports }}
                working-directory: backend
                run: |
                    tar -cf backend-reports.tar \
                      sbom.cyclonedx.json \
                      $(test -f build/reports/dependency-license/index.html && echo build/reports/dependency-license/index.html) \
                      $(test -d build/reports/project/dependencies && echo build/reports/project/dependencies)
            -   name: Upload reports + SBOM
                if: ${{ inputs.generateReports }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: backend-reports
                    path: backend/backend-reports.tar
                    retention-days: 1
