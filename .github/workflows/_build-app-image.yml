name: _build-app-image

on:
    workflow_call:
        inputs:
            stack:
                description: "backend | frontend"
                type: string
                required: true
            tags:
                description: "Newline-separated fully-qualified image tags to build/push."
                type: string
                required: true
            primaryTag:
                description: "One tag used for the post-push cosign verify."
                type: string
                required: true
            push:
                type: boolean
                default: false
            platforms:
                type: string
                default: "linux/amd64,linux/arm64"

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Download stage bundle
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    name: ${{ inputs.stack }}-stage
                    path: ${{ inputs.stack }}
            -   name: Restore stage bundle
                working-directory: ${{ inputs.stack }}
                env:
                    STACK: ${{ inputs.stack }}
                run: tar -xf "${STACK}-stage.tar" && rm "${STACK}-stage.tar"

            -   name: Install Cosign
                if: ${{ inputs.push }}
                uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
            -   name: Set up QEMU
                uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            -   name: Build image for non-root check
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
                with:
                    context: ${{ inputs.stack }}
                    file: ${{ inputs.stack }}/Dockerfile
                    build-args: BUILD_MODE=ci
                    platforms: linux/amd64
                    load: true
                    push: false
                    tags: ${{ inputs.stack }}-nonroot-check:latest

            -   name: Verify image runs as non-root
                env:
                    STACK: ${{ inputs.stack }}
                run: |
                    USER_ID="$(docker inspect --format '{{.Config.User}}' "${STACK}-nonroot-check:latest")"
                    echo "Image user: '${USER_ID}'"
                    if [ -z "${USER_ID}" ] || [ "${USER_ID}" = "0" ] || [ "${USER_ID}" = "root" ] || [ "${USER_ID}" = "0:0" ]; then
                      echo "::error::${STACK} image has no non-root USER set (Config.User='${USER_ID}')"
                      exit 1
                    fi

            -   name: Login to GitHub Container Registry
                if: ${{ inputs.push }}
                uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push image
                id: build-and-push
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
                with:
                    context: ${{ inputs.stack }}
                    file: ${{ inputs.stack }}/Dockerfile
                    build-args: BUILD_MODE=ci
                    platforms: ${{ inputs.platforms }}
                    push: ${{ inputs.push }}
                    provenance: false
                    tags: ${{ inputs.tags }}

            -   name: Sign the image with the GitHub OIDC token
                if: ${{ inputs.push }}
                env:
                    DIGEST: ${{ steps.build-and-push.outputs.digest }}
                    TAGS: ${{ inputs.tags }}
                run: |
                    while IFS= read -r tag; do
                      [ -z "${tag}" ] && continue
                      cosign sign --yes "${tag}@${DIGEST}"
                    done <<< "${TAGS}"

            -   name: Verify the signed image
                if: ${{ inputs.push }}
                env:
                    PRIMARY_TAG: ${{ inputs.primaryTag }}
                run: |
                    cosign verify "${PRIMARY_TAG}" \
                       --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/_build-app-image.yml@${GITHUB_REF}" \
                       --certificate-oidc-issuer https://token.actions.githubusercontent.com
