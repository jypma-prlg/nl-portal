name: _build-app-image

on:
    workflow_call:
        inputs:
            stack:
                description: "backend | frontend"
                type: string
                required: true
            tags:
                description: "Newline-separated fully-qualified image tags to build/push."
                type: string
                required: true
            primaryTag:
                description: "One tag used for the post-push cosign verify."
                type: string
                required: true
            labels:
                description: "Newline-separated OCI labels for the pushed image."
                type: string
                default: ""
            push:
                type: boolean
                default: false
            platforms:
                type: string
                default: "linux/amd64,linux/arm64"

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Download stage bundle
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    name: ${{ inputs.stack }}-stage
                    path: ${{ inputs.stack }}
            -   name: Restore stage bundle
                working-directory: ${{ inputs.stack }}
                env:
                    STACK: ${{ inputs.stack }}
                run: tar -xf "${STACK}-stage.tar" && rm "${STACK}-stage.tar"

            -   name: Install Cosign
                if: ${{ inputs.push }}
                uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
            -   name: Set up QEMU
                uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            -   name: Build image for non-root check
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
                with:
                    context: ${{ inputs.stack }}
                    file: ${{ inputs.stack }}/Dockerfile
                    build-args: BUILD_MODE=ci
                    platforms: linux/amd64
                    load: true
                    push: false
                    tags: ${{ inputs.stack }}-nonroot-check:latest

            -   name: Verify image runs as non-root
                env:
                    STACK: ${{ inputs.stack }}
                run: |
                    USER_ID="$(docker inspect --format '{{.Config.User}}' "${STACK}-nonroot-check:latest")"
                    echo "Image user: '${USER_ID}'"
                    if [ -z "${USER_ID}" ] || [ "${USER_ID}" = "0" ] || [ "${USER_ID}" = "root" ] || [ "${USER_ID}" = "0:0" ]; then
                      echo "::error::${STACK} image has no non-root USER set (Config.User='${USER_ID}')"
                      exit 1
                    fi

            -   name: Login to GitHub Container Registry
                if: ${{ inputs.push }}
                uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push image
                id: build-and-push
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
                with:
                    context: ${{ inputs.stack }}
                    file: ${{ inputs.stack }}/Dockerfile
                    build-args: BUILD_MODE=ci
                    platforms: ${{ inputs.platforms }}
                    push: ${{ inputs.push }}
                    provenance: false
                    labels: ${{ inputs.labels }}
                    tags: ${{ inputs.tags }}

            -   name: Sign the image with the GitHub OIDC token
                if: ${{ inputs.push }}
                env:
                    DIGEST: ${{ steps.build-and-push.outputs.digest }}
                    TAGS: ${{ inputs.tags }}
                run: |
                    while IFS= read -r tag; do
                      [ -z "${tag}" ] && continue
                      cosign sign --yes "${tag}@${DIGEST}"
                    done <<< "${TAGS}"

            -   name: Verify the signed image
                if: ${{ inputs.push }}
                env:
                    PRIMARY_TAG: ${{ inputs.primaryTag }}
                run: |
                    cosign verify "${PRIMARY_TAG}" \
                       --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/_build-app-image.yml@${GITHUB_REF}" \
                       --certificate-oidc-issuer https://token.actions.githubusercontent.com

            -   name: Generate the image SBOM with Syft
                if: ${{ inputs.push }}
                uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
                with:
                    image: ${{ inputs.primaryTag }}@${{ steps.build-and-push.outputs.digest }}
                    format: cyclonedx-json
                    output-file: image-sbom.cyclonedx.json
                    upload-artifact: false
                    upload-release-assets: false

            -   name: Attest the SBOM on the image digest
                if: ${{ inputs.push }}
                env:
                    DIGEST: ${{ steps.build-and-push.outputs.digest }}
                    TAGS: ${{ inputs.tags }}
                run: |
                    while IFS= read -r tag; do
                      [ -z "${tag}" ] && continue
                      cosign attest --yes --type cyclonedx --predicate image-sbom.cyclonedx.json "${tag}@${DIGEST}"
                    done <<< "${TAGS}"

            -   name: Verify the SBOM attestation
                if: ${{ inputs.push }}
                env:
                    PRIMARY_TAG: ${{ inputs.primaryTag }}
                run: |
                    cosign verify-attestation "${PRIMARY_TAG}" --type cyclonedx \
                       --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/_build-app-image.yml@${GITHUB_REF}" \
                       --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

            -   name: Upload the image SBOM for the release
                if: ${{ inputs.push }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: ${{ inputs.stack }}-image-sbom
                    path: image-sbom.cyclonedx.json
