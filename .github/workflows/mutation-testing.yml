name: Mutation testing (backend core)

on:
    pull_request:
        paths:
            - "backend/core/**"
            - "backend/gradle/verification-metadata.xml"
            - "backend/build.gradle.kts"
            - "backend/settings.gradle.kts"
            - "backend/gradle.properties"
    schedule:
        -   cron: "0 3 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: mutation-testing-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pitest:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Set up mise (installs java from mise.toml's [tools])
                uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
            -   name: Pitest op gewijzigde klassen (PR, drempel 80%)
                if: github.event_name == 'pull_request'
                working-directory: backend
                env:
                    BASE_REF: ${{ github.base_ref }}
                run: |
                    set -euo pipefail
                    # Wildcard achter de klassenaam dekt ook binnenklassen, companions en top-level functies (FooKt).
                    # Met R (hernoemd) erbij valt een verplaatste klasse niet buiten de gate.
                    changed=$(git diff --name-only --diff-filter=AMR "origin/${BASE_REF}...HEAD" -- 'core/src/main/kotlin/**/*.kt'                         | sed -E 's#^core/src/main/kotlin/##; s#\.kt$#*#; s#/#.#g' | paste -sd, -)
                    if [ -z "$changed" ]; then echo "Geen gewijzigde core-klassen."; exit 0; fi
                    ./gradlew :core:pitest -PpitestTargetClasses="$changed" -PpitestThreshold=80
            -   name: Pitest op volledige core (nachtelijk/handmatig, ratchet)
                if: github.event_name != 'pull_request'
                working-directory: backend
                run: ./gradlew :core:pitest
            -   name: Upload rapport
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: pitest-report
                    path: backend/core/build/reports/pitest
                    if-no-files-found: ignore
