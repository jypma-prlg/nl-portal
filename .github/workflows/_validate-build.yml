name: _validate-build

on:
    workflow_call:
        inputs:
            nodeVersion:
                type: string
                default: "24"
            runBackend:
                description: "Build+test the backend stack."
                type: boolean
                default: true
            runFrontend:
                description: "Build+test the frontend stack."
                type: boolean
                default: true

permissions:
    contents: read

jobs:
    build-be:
        if: ${{ inputs.runBackend }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up JDK
                uses: ./.github/actions/setup-backend-jdk
            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
            -   name: Build with Gradle
                working-directory: backend
                run: ./gradlew build
            # New modules or layer changes in ModuleLayers are architecture decisions; summarise them
            # in plain language for the PR (#177). ci.yml posts the summary as a PR comment.
            # Informational only: a failure here must not block the PR gate.
            -   name: Summarise module layer changes
                id: module-layers
                if: ${{ github.event_name == 'pull_request' }}
                continue-on-error: true
                working-directory: backend
                env:
                    BASE_REF: ${{ github.base_ref }}
                run: |
                    git fetch --no-tags --depth=1 origin "${BASE_REF}"
                    ./gradlew :architecture-test:moduleLayerChanges -PmoduleLayersBaseRef=FETCH_HEAD
                    cat architecture-test/build/reports/module-layers/pr-summary.md >> "${GITHUB_STEP_SUMMARY}"
            -   name: Upload module layer summary
                if: ${{ steps.module-layers.outcome == 'success' }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: module-layers-summary
                    path: backend/architecture-test/build/reports/module-layers/pr-summary.md
                    if-no-files-found: error

    build-fe:
        if: ${{ inputs.runFrontend }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up Node.js ${{ inputs.nodeVersion }}
                uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
                with:
                    node-version: ${{ inputs.nodeVersion }}
            -   name: Install
                working-directory: frontend
                run: npm install -g pnpm@11 && pnpm install
            -   name: Build
                working-directory: frontend
                run: pnpm -r build
            -   name: Lint
                working-directory: frontend
                run: pnpm lint
            -   name: Lint CSS
                working-directory: frontend
                run: pnpm lint:css
            -   name: Typecheck
                working-directory: frontend
                run: pnpm typecheck
            -   name: Test
                working-directory: frontend
                run: pnpm test
            -   name: Prettier
                working-directory: frontend
                run: pnpm prettier
