name: Dependency check

on:
    schedule:
        -   cron: "0 18 * * 0"
    workflow_dispatch:

permissions:
    contents: read
    issues: write

concurrency:
    group: dependency-check-${{ github.ref }}
    cancel-in-progress: true

env:
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    dependency-check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Setup Java
                uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
                with:
                    distribution: temurin
                    java-version: 21
            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
            -   name: Build project
                run: ./gradlew build -x test -x integrationTest -x spotlessCheck
            -   name: Dependency check
                uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main
                env:
                    JAVA_HOME: /opt/jdk
                with:
                    project: 'nl-portal'
                    path: 'backend'
                    format: 'HTML'
                    out: 'backend/dependency-check'
                    args: >
                        --failOnCVSS 8
                        --format HTML
                        --format JSON
                        --enableRetired
                        --suppression backend/cve-exclusions.xml
            -   name: Upload results
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: dependency-check-result
                    path: backend/dependency-check
                    retention-days: 7
            -   name: Set up Node.js
                if: always()
                uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
                with:
                    node-version: "24"
            -   name: Escaleer Critical/High-bevindingen
                if: always()
                working-directory: ${{ github.workspace }}
                run: node scripts/escalate-findings.mjs --source=dependency-check --report=backend/dependency-check/dependency-check-report.json
