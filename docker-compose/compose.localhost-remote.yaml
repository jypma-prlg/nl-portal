services:
    localhost:
        ports:
            - "8080:8080"
            - "8000:8000"
            - "3000:8081"

    nl-portal-backend:
        # Eigen images van pinkroccade. Er is nog geen release-tag (alleen snapshots), dus de tag
        # is verplicht via NL_PORTAL_IMAGE_TAG; zie docker-compose/README.md.
        image: ghcr.io/pinkroccade/nl-portal-backend:${NL_PORTAL_IMAGE_TAG:?zet NL_PORTAL_IMAGE_TAG op een tag uit ghcr.io/pinkroccade/nl-portal-backend en -frontend (zie docker-compose/README.md)}
        container_name: nl-portal-backend
        network_mode: "service:localhost"
        env_file: imports/backend.env
        environment:
            NLPORTAL_FEATUREFLAGS_FILE: /etc/nl-portal/flags/nl-portal.flagd.json
            SPRING_CONFIG_IMPORT: optional:configtree:/etc/nl-portal/koppelingen/
        volumes:
            - ./imports/flags:/etc/nl-portal/flags:ro
            - ./imports/koppelingen:/etc/nl-portal/koppelingen:ro

    nl-portal-frontend:
        image: ghcr.io/pinkroccade/nl-portal-frontend:${NL_PORTAL_IMAGE_TAG:?zet NL_PORTAL_IMAGE_TAG op een tag uit ghcr.io/pinkroccade/nl-portal-backend en -frontend (zie docker-compose/README.md)}
        container_name: nl-portal-frontend
        network_mode: "service:localhost"
        env_file: imports/frontend.env
