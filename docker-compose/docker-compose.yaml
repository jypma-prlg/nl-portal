name: nl-portal-docker-compose

include:
    - path: "compose.localhost-${RUN_MODE:-sources}.yaml"
    - path: "compose.netwerk-${NETWERK:-uit}.yaml"

services:

    localhost:
        container_name: localhost
        image: alpine:latest
        command: sleep infinity
        ports:
            - "8082:8082" # Keycloak port
            - "8001:8001" # OpenZaak
            - "8010:8010" # Open Object
            - "8012:8012" # Open Notificaties
            - "8014:8014" # OpenKlant 2
            - "8015:8015" # OpenProduct
            - "5010:5010" # Haalcentraal BRP
            - "5011:5011" # Haalcentraal Bewoning
            - "3310:3310" # ClamAV virus scan

    nl-portal-keycloak:
        container_name: nl-portal-keycloak
        depends_on:
            - nl-portal-keycloak-database
        image: quay.io/keycloak/keycloak:26.3
        network_mode: "service:localhost"
        environment:
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://nl-portal-keycloak-database/keycloak
            KC_DB_USERNAME: keycloak
            KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?draai eerst mise run dev:setup}
            KC_HTTP_RELATIVE_PATH: /auth
        volumes:
            - ./.generated/keycloak:/opt/keycloak/data/import:ro
        command: "start-dev --import-realm --http-port=8082"

    nl-portal-keycloak-database:
        container_name: nl-portal-keycloak-database
        image: postgres:15
        environment:
            POSTGRES_USER: keycloak
            POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?draai eerst mise run dev:setup}

    nl-portal-openzaak:
        image: openzaak/open-zaak:1.31.1
        container_name: nl-portal-openzaak
        platform: linux/amd64
        profiles:
            - zgw
            - openzaak
        network_mode: "service:localhost"
        environment: &openzaak-env
            - OPENZAAK_PORT=8001
            - OTEL_SDK_DISABLED=true
            - DB_HOST=nl-portal-openzaak-database
            - DB_PORT=5432
            - SECRET_KEY=${OPENZAAK_SECRET_KEY:?draai eerst mise run dev:setup}
            - DB_USER=openzaak
            - DB_PASSWORD=${OPENZAAK_DB_PASSWORD:?draai eerst mise run dev:setup}
            - DB_NAME=openzaak
            - CACHE_DEFAULT=nl-portal-redis:6379/0
            - CACHE_AXES=nl-portal-redis:6379/0
            - DEBUG=true
            - ALLOWED_HOSTS=localhost,host.docker.internal,172.17.0.1,openzaak,example.com
            - OPENZAAK_SUPERUSER_USERNAME=admin
            - OPENZAAK_SUPERUSER_EMAIL=admin@example.org
            - CELERY_BROKER_URL=redis://nl-portal-redis:6379/1
            - CELERY_RESULT_BACKEND=redis://nl-portal-redis:6379/1
            - DJANGO_SUPERUSER_PASSWORD=${OPENZAAK_ADMIN_PASSWORD:?draai eerst mise run dev:setup}
            - SENDFILE_BACKEND=django_sendfile.backends.simple
            - DISABLE_2FA=true
        depends_on:
            - nl-portal-openzaak-database
            - nl-portal-redis
        volumes:
            - ./imports/openzaak/private-media:/app/private-media

    nl-portal-openzaak-import:
        image: openzaak/open-zaak:1.31.1
        container_name: nl-portal-openzaak-import
        platform: linux/amd64
        profiles:
            - zgw
            - openzaak
        environment: *openzaak-env
        network_mode: "service:localhost"
        command: sh init/init.sh
        volumes:
            - ./imports/openzaak/fixtures:/app/src/openzaak/fixtures
            - ./imports/openzaak/private-media:/app/private-media
            - ./imports/openzaak/init:/app/init
            - ./.generated/openzaak:/app/generated:ro
        depends_on:
            - nl-portal-openzaak
            - nl-portal-openzaak-database
            - nl-portal-redis

    nl-portal-openzaak-database:
        image: postgis/postgis:15-3.5
        container_name: nl-portal-openzaak-database
        platform: linux/amd64
        profiles:
            - zgw
            - openzaak
        environment:
            - POSTGRES_USER=openzaak
            - POSTGRES_PASSWORD=${OPENZAAK_DB_PASSWORD:?draai eerst mise run dev:setup}
            - POSTGRES_DB=openzaak

    nl-portal-openklant-2:
        image: maykinmedia/open-klant:2.19.2
        container_name: nl-portal-openklant-2
        profiles:
            - zgw
            - openklant
        depends_on:
            - nl-portal-openklant-2-db
            - nl-portal-redis
        network_mode: "service:localhost"
        environment: &openklant-2-env
            - OPENKLANT_PORT=8014
            - OTEL_SDK_DISABLED=true
            - DJANGO_SETTINGS_MODULE=openklant.conf.docker
            - IS_HTTPS=no
            - DB_NAME=openklant
            - DB_USER=openklant
            - DB_PASSWORD=${OPENKLANT_DB_PASSWORD:?draai eerst mise run dev:setup}
            - DB_HOST=nl-portal-openklant-2-db
            - ALLOWED_HOSTS=*
            - CACHE_DEFAULT=nl-portal-redis:6379/2
            - CACHE_AXES=nl-portal-redis:6379/2
            - SUBPATH=${SUBPATH:-/}
            - SECRET_KEY=${OPENKLANT_SECRET_KEY:?draai eerst mise run dev:setup}
            - CELERY_BROKER_URL=redis://nl-portal-redis:6379/3
            - CELERY_RESULT_BACKEND=redis://nl-portal-redis:6379/3
            - DISABLE_2FA=true
        volumes:
            - ./imports/openklant-2/fixtures:/app/src/openklant/fixtures

    nl-portal-openklant-2-import:
        image: maykinmedia/open-klant:2.19.2
        container_name: nl-portal-openklant-2-import
        profiles:
            - zgw
            - openklant
        environment: *openklant-2-env
        network_mode: "service:localhost"
        command: sh init/init.sh
        volumes:
            - ./imports/openklant-2/fixtures:/app/src/openklant/fixtures
            - ./imports/openklant-2/init:/app/init
            - ./.generated/openklant-2:/app/generated:ro
        depends_on:
            - nl-portal-openklant-2
            - nl-portal-openklant-2-db
            - nl-portal-redis

    nl-portal-openklant-2-db:
        image: postgres:15
        container_name: nl-portal-openklant-2-db
        profiles:
            - zgw
            - openklant
        environment:
            - POSTGRES_USER=openklant
            - POSTGRES_PASSWORD=${OPENKLANT_DB_PASSWORD:?draai eerst mise run dev:setup}
            - POSTGRES_DB=openklant

    nl-portal-open-object:
        image: maykinmedia/open-object:4.3.0
        container_name: nl-portal-open-object
        platform: linux/amd64
        network_mode: "service:localhost"
        profiles:
            - zgw
            - objecten
        environment: &objects-env
            - OPENOBJECT_PORT=8010
            - OTEL_SDK_DISABLED=true
            - CORS_ALLOW_ALL_ORIGINS=true
            - SECRET_KEY=${OBJECTS_SECRET_KEY:?draai eerst mise run dev:setup}
            - DJANGO_SETTINGS_MODULE=objects.conf.docker
            - DB_HOST=nl-portal-open-object-database
            - DB_PASSWORD=${OBJECTS_DB_PASSWORD:?draai eerst mise run dev:setup}
            - DEBUG=true
            - TWO_FACTOR_FORCE_OTP_ADMIN=False
            - TWO_FACTOR_PATCH_ADMIN=False
            - DISABLE_2FA=true
            - CACHE_AXES=nl-portal-redis:6379/4
            - CACHE_DEFAULT=nl-portal-redis:6379/4
            - ALLOWED_HOSTS=localhost,host.docker.internal,172.17.0.1
            - CELERY_BROKER_URL=redis://nl-portal-redis:6379/5
            - CELERY_RESULT_EXPIRES=3600
            - CELERY_RESULT_BACKEND=redis://nl-portal-redis:6379/5
            - CELERY_LOGLEVEL=DEBUG
            - SITE_DOMAIN=localhost:8010
            - OTEL_SERVICE_NAME=open-object
            - OBJECTS_SUPERUSER_USERNAME=admin
            - OBJECTS_SUPERUSER_EMAIL=admin@example.org
            - OBJECTS_SUPERUSER_PASSWORD=${OBJECTS_ADMIN_PASSWORD:?draai eerst mise run dev:setup}
        depends_on:
            - nl-portal-open-object-database
            - nl-portal-redis

    nl-portal-open-object-celery:
        image: maykinmedia/open-object:4.3.0
        container_name: nl-portal-open-object-celery
        platform: linux/amd64
        network_mode: "service:localhost"
        profiles:
            - zgw
            - objecten
        depends_on:
            - nl-portal-open-object
            - nl-portal-open-object-database
            - nl-portal-redis
        command: /celery_worker.sh
        environment: *objects-env

    nl-portal-open-object-database:
        image: postgis/postgis:15-3.5
        container_name: nl-portal-open-object-database
        platform: linux/amd64
        profiles:
            - zgw
            - objecten
        environment:
            - POSTGRES_USER=objects
            - POSTGRES_PASSWORD=${OBJECTS_DB_PASSWORD:?draai eerst mise run dev:setup}
            - POSTGRES_DB=objects

    nl-portal-open-object-import:
        image: maykinmedia/open-object:4.3.0
        container_name: nl-portal-open-object-import
        platform: linux/amd64
        profiles:
            - zgw
            - objecten
        environment: *objects-env
        network_mode: "service:localhost"
        command: sh init/init.sh
        volumes:
            - ./imports/open-object/fixtures:/app/src/objects/fixtures
            - ./imports/open-object/init:/app/init
            - ./.generated/open-object:/app/generated:ro
        depends_on:
            - nl-portal-open-object
            - nl-portal-open-object-database

    nl-portal-open-notificaties:
        image: openzaak/open-notificaties:1.17.0
        container_name: nl-portal-open-notificaties
        platform: linux/amd64
        network_mode: "service:localhost"
        profiles:
            - zgw
            - objecten
        environment: &notificaties-env
            - OPENNOTIFICATIES_PORT=8012
            - OTEL_SDK_DISABLED=true
            - DJANGO_SETTINGS_MODULE=nrc.conf.docker
            - SECRET_KEY=${NOTIFICATIES_SECRET_KEY:?draai eerst mise run dev:setup}
            - ALLOWED_HOSTS=*
            - CACHE_DEFAULT=nl-portal-redis:6379/7
            - CACHE_AXES=nl-portal-redis:6379/7
            - DB_PORT=5432
            - DB_HOST=nl-portal-open-notificaties-database
            - DB_NAME=notifications
            - DB_USER=notifications
            - DB_PASSWORD=${NOTIFICATIES_DB_PASSWORD:?draai eerst mise run dev:setup}
            - RABBITMQ_HOST=open-notificaties-rabbitmq
            - PUBLISH_BROKER_URL=amqp://notificaties:${NOTIFICATIES_RABBITMQ_PASSWORD:?draai eerst mise run dev:setup}@nl-portal-open-notificaties-rabbitmq:5672//
            - CELERY_BROKER_URL=amqp://notificaties:${NOTIFICATIES_RABBITMQ_PASSWORD:?draai eerst mise run dev:setup}@nl-portal-open-notificaties-rabbitmq:5672//
            - CELERY_RESULT_BACKEND=redis://nl-portal-redis:6379/8
            - CELERY_LOGLEVEL=DEBUG
            - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-4}
            - OPENNOTIFICATIES_SUPERUSER_USERNAME=admin
            - OPENNOTIFICATIES_SUPERUSER_EMAIL=admin@localhost
            - DJANGO_SUPERUSER_PASSWORD=${NOTIFICATIES_ADMIN_PASSWORD:?draai eerst mise run dev:setup}
            - LOG_NOTIFICATIONS_IN_DB=yes
            - DISABLE_2FA=true

    nl-portal-open-notificaties-import:
        image: openzaak/open-notificaties:1.17.0
        container_name: nl-portal-open-notificaties-import
        platform: linux/amd64
        network_mode: "service:localhost"
        profiles:
            - zgw
            - objecten
        command: sh init/init.sh
        volumes:
            - ./imports/open-notificaties/fixtures:/app/src/nrc/fixtures
            - ./imports/open-notificaties/init:/app/init
            - ./.generated/open-notificaties:/app/generated:ro
        depends_on:
            - nl-portal-open-notificaties
            - nl-portal-open-notificaties-database
        environment: *notificaties-env

    nl-portal-open-notificaties-celery:
        image: openzaak/open-notificaties:1.17.0
        container_name: nl-portal-open-notificaties-celery
        platform: linux/amd64
        network_mode: "service:localhost"
        profiles:
            - zgw
            - objecten
        command: /celery_worker.sh
        healthcheck:
            test: [ "CMD", "python", "/app/bin/check_celery_worker_liveness.py" ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        environment: *notificaties-env

    nl-portal-open-notificaties-database:
        image: postgis/postgis:15-3.5
        container_name: nl-portal-open-notificaties-database
        platform: linux/amd64
        profiles:
            - zgw
            - objecten
        environment:
            - POSTGRES_USER=notifications
            - POSTGRES_PASSWORD=${NOTIFICATIES_DB_PASSWORD:?draai eerst mise run dev:setup}
            - POSTGRES_DB=notifications

    nl-portal-open-notificaties-rabbitmq:
        image: rabbitmq:3.13-management
        container_name: nl-portal-open-notificaties-rabbitmq
        profiles:
            -   objecten
        environment:
            - RABBITMQ_DEFAULT_USER=notificaties
            - RABBITMQ_DEFAULT_PASS=${NOTIFICATIES_RABBITMQ_PASSWORD:?draai eerst mise run dev:setup}

    nl-portal-openproduct:
        image: maykinmedia/open-product:1.10.0
        container_name: nl-portal-openproduct
        profiles:
            - zgw
            - openproduct
        platform: linux/amd64
        network_mode: "service:localhost"
        depends_on:
            - nl-portal-openproduct-database
            - nl-portal-redis
        environment: &open-product-env
            - OPENPRODUCT_PORT=8015
            - OTEL_SDK_DISABLED=true
            - DJANGO_SETTINGS_MODULE=openproduct.conf.docker
            - SECRET_KEY=${OPENPRODUCT_SECRET_KEY:?draai eerst mise run dev:setup}
            - DB_NAME=openproduct
            - DB_USER=openproduct
            - DB_PASSWORD=${OPENPRODUCT_DB_PASSWORD:?draai eerst mise run dev:setup}
            - DB_HOST=nl-portal-openproduct-database
            - DB_PORT=5432
            - CACHE_DEFAULT=nl-portal-redis:6379/9
            - CACHE_AXES=nl-portal-redis:6379/11
            - CELERY_BROKER_URL=redis://nl-portal-redis:6379/10
            - CELERY_RESULT_BACKEND=redis://nl-portal-redis:6379/10
            - ALLOWED_HOSTS=*
            - DISABLE_2FA=true
            - OPENPRODUCT_SUPERUSER_USERNAME=admin
            - OPENPRODUCT_SUPERUSER_EMAIL=admin@example.org
            - OPENPRODUCT_SUPERUSER_PASSWORD=${OPENPRODUCT_ADMIN_PASSWORD:?draai eerst mise run dev:setup}

    nl-portal-openproduct-import:
        image: maykinmedia/open-product:1.10.0
        container_name: nl-portal-openproduct-import
        platform: linux/amd64
        profiles:
            - zgw
            - openproduct
        environment: *open-product-env
        network_mode: "service:localhost"
        command: sh init/init.sh
        volumes:
            - ./imports/openproduct/fixtures:/app/src/openproduct/fixtures
            - ./imports/openproduct/init:/app/init
            - ./.generated/openproduct:/app/generated:ro
        depends_on:
            - nl-portal-openproduct
            - nl-portal-openproduct-database
            - nl-portal-redis

    nl-portal-openproduct-celery:
        image: maykinmedia/open-product:1.10.0
        container_name: nl-portal-openproduct-celery
        platform: linux/amd64
        network_mode: "service:localhost"
        profiles:
            - zgw
            - openproduct
        command: /celery_worker.sh
        environment: *open-product-env

    nl-portal-openproduct-database:
        image: postgres:17
        container_name: nl-portal-openproduct-database
        profiles:
            - zgw
            - openproduct
        environment:
            - POSTGRES_USER=${DB_USER:-openproduct}
            - POSTGRES_PASSWORD=${OPENPRODUCT_DB_PASSWORD:?draai eerst mise run dev:setup}
            - POSTGRES_DB=openproduct

    nl-portal-redis:
        image: redis:6.2.24
        container_name: nl-portal-redis
        profiles:
            - zgw
            - openzaak
            - objecten
            - openproduct
            - openklant

    nl-portal-haalcentraal-personen:
        container_name: nl-portal-haalcentraal-personen
        profiles:
            - haalcentraal
        image: ghcr.io/brp-api/personen-mock:2.2.1
        network_mode: "service:localhost"
        environment:
            - ASPNETCORE_ENVIRONMENT=Release
            - ASPNETCORE_URLS=http://+:5010

    nl-portal-haalcentraal-bewoningen:
        container_name: nl-portal-haalcentraal-bewoningen
        profiles:
            - haalcentraal
        image: ghcr.io/brp-api/haal-centraal-bewoning-bevragen-mock:2.0.1
        network_mode: "service:localhost"
        environment:
            - ASPNETCORE_ENVIRONMENT=Release
            - ASPNETCORE_URLS=http://+:5011

    nl-portal-clamav:
        container_name: nl-portal-clamav
        image: clamav/clamav:latest
        platform: linux/amd64
        profiles:
            - clamav
        network_mode: "service:localhost"
        healthcheck:
            test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 120s
