  - {module: backend/zgw/common-ground-authentication-test, rol: test-library}
  - {module: backend/zgw/idtoken-authentication, rol: library (ZGW JWT naar API's)}
  - {module: backend/zgw/objectenapi, rol: library (client Objecten API)}
  - {module: backend/zgw/catalogi-api, rol: library (client Catalogi API)}
  - {module: backend/zgw/zaken-api, rol: library (client Zaken API)}
  - {module: backend/zgw/documenten-api, rol: library (client Documenten API + ClamAV; deprecated virusscan-API)}
  - {module: backend/app, rol: assembly (runnable)}
  - {module: backend/app-dev, rol: assembly (dev-runnable)}
  - {module: backend/architecture-test, rol: test (ArchUnit)}
  - {module: backend/gradle/license-report, rol: build-tooling}
  - {module: backend/product, rol: verwijderd 2026-10-22; alleen lokale build/-map over (mag weg)}

