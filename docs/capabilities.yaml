# Capability-inventaris backend NL Portal.
# Ingangen = GraphQL @QueryMapping/@MutationMapping, REST @*Mapping, @EventListener.
# @SchemaMapping-veldresolvers (Zaak.*, Besluit.*, Bericht.documenten, OpenProduct*.*) zijn geen ingang en niet opgenomen.
# frontend_gebruikt: query-document in frontend/packages/api/src EN hook/document gebruikt in user-interface (of REST-pad in user-interface).
# Statussen: in-ontwikkeling | actief | twijfel | kandidaat-verwijderen | deprecated (met ADR) | verwijderd.
# deprecated/verwijderd zet alleen de maintainer. Status op ingang-niveau overschrijft die van de capability voor die ingang.
# Statusreview maintainer: 2026-11-04.
# Fitness-test: backend/architecture-test (CapabilityInventoryFitnessTest, draait mee in `check`).
#   - ingang in code maar niet hier  -> waarschuwing (warn-modus) / falen (hard-modus)
#   - ingang hier maar niet in code  -> altijd falen
#   - hard-modus: zet HARD_MODE = true in backend/architecture-test/src/test/kotlin/nl/nlportal/architecture/InventoryComparison.kt
#   - naam-conventie: graphql = operatienaam, rest = "METHOD /volledig/pad" (tussen quotes), event-listener = klassenaam.
